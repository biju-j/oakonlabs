<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAKON LABS · PLAYS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;700&display=swap" rel="stylesheet">

<!-- All config injected by GitHub Actions at deploy time. No manual edits needed. -->

<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --g:   #00FF41;  --gd: #008B23;  --cy: #00E5FF;
  --am:  #FFB400;  --rd: #FF3A3A;
  --bg:  #020C06;  --bg2: #040F09;
  --bdr: rgba(0,255,65,0.13);
  --txt: #9EC9A8;
  --card-gap: 18px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { min-height:100vh; overflow-x:hidden; }
body {
  background:var(--bg);
  color:var(--txt);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
}
a { color:var(--g); text-decoration:none; }

/* Grid atmosphere */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,65,0.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,0.022) 1px,transparent 1px);
  background-size:42px 42px;
}
body::after {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
}

/* ── NAV ─────────────────────────────────────────────────────── */
#main-nav {
  display:none; position:fixed; top:0; left:0; right:0; z-index:200;
  height:52px; padding:0 28px;
  align-items:center; justify-content:space-between;
  background:rgba(2,12,6,0.97); border-bottom:1px solid var(--bdr);
  backdrop-filter:blur(10px);
}
.nav-logo {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:12px; letter-spacing:4px; color:var(--g);
  text-shadow:0 0 12px var(--g);
}
.nav-right { display:flex; align-items:center; gap:14px; font-size:9px; }
.nav-user  { color:var(--cy); font-size:9px; }
#nav-clock { font-variant-numeric:tabular-nums; color:var(--gd); }
.nav-signout {
  padding:4px 12px; border:1px solid rgba(255,58,58,0.35);
  color:var(--rd); background:rgba(255,58,58,0.04);
  font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:2px;
  cursor:pointer; border-radius:2px; transition:all 0.2s;
}
.nav-signout:hover { background:rgba(255,58,58,0.12); }

/* ── BOUNCER SCREEN ──────────────────────────────────────────── */
#bouncer-screen {
  position:fixed; inset:0; background:var(--bg); z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:24px; text-align:center;
}
.b-radar {
  position:relative; width:110px; height:110px;
}
.b-ring {
  position:absolute; border-radius:50%;
  border:1px solid rgba(0,255,65,0.2); inset:0;
}
.b-ring:nth-child(2){ inset:22%; border-color:rgba(0,255,65,0.16); }
.b-ring:nth-child(3){ inset:44%; border-color:rgba(0,255,65,0.28); }
.b-sweep {
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,transparent 290deg,rgba(0,255,65,0.06) 310deg,rgba(0,255,65,0.38) 360deg);
  animation:sweep 3.6s linear infinite;
}
.b-title {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:clamp(20px,4vw,30px); letter-spacing:5px; color:#fff;
  text-shadow:0 0 28px rgba(0,255,65,0.18);
}
.b-sub { font-size:9px; letter-spacing:4px; color:var(--gd); }
.b-desc { font-size:12px; line-height:1.9; color:var(--txt); max-width:340px; }
#b-error {
  display:none; font-size:11px; letter-spacing:1px;
  color:var(--rd); border:1px solid rgba(255,58,58,0.3);
  padding:9px 18px; border-radius:2px; background:rgba(255,58,58,0.04);
  max-width:360px;
}
.b-lock { font-size:9px; letter-spacing:3px; color:var(--gd); }

/* ── DASHBOARD ───────────────────────────────────────────────── */
#dashboard { display:none; padding:72px 24px 60px; position:relative; z-index:1; }
.inner { max-width:1120px; margin:0 auto; }

/* ── TABS ────────────────────────────────────────────────────── */
.tabs-wrap {
  display:flex; gap:8px; flex-wrap:wrap;
  margin-bottom:28px; padding-bottom:14px;
  border-bottom:1px solid var(--bdr);
}
.tab-btn {
  padding:8px 20px; border-radius:2px; cursor:pointer;
  border:1px solid var(--bdr); color:var(--gd);
  background:rgba(0,255,65,0.025);
  font-family:'Orbitron',sans-serif; font-size:9px; letter-spacing:3px;
  transition:all 0.2s;
}
.tab-btn:hover { background:rgba(0,229,255,0.07); color:var(--cy); }
.tab-btn.active {
  background:rgba(0,229,255,0.10); color:var(--cy);
  border-color:rgba(0,229,255,0.55);
  box-shadow:0 0 16px rgba(0,229,255,0.18);
  text-shadow:0 0 10px rgba(0,229,255,0.5);
}

/* ── TAB LABEL ───────────────────────────────────────────────── */
.tab-label {
  font-family:'Orbitron',sans-serif; font-size:8px; letter-spacing:4px;
  color:var(--cy); margin-bottom:18px; opacity:0.7;
}
.tab-label::before { content:'// '; opacity:0.4; }

/* ── CARD GRID ───────────────────────────────────────────────── */
.card-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:var(--card-gap);
}
.empty-msg {
  grid-column:1/-1; text-align:center;
  color:var(--gd); font-size:12px; padding:48px 0;
  letter-spacing:2px;
}

/* ── KEEP-STYLE CARD ─────────────────────────────────────────── */
.keep-card {
  border-radius:16px; padding:22px 22px 18px;
  min-height:150px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:transform 0.22s ease, box-shadow 0.22s ease;
  cursor:default;
}
.keep-card::before {
  content:''; position:absolute; inset:0; border-radius:16px;
  background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,transparent 60%);
  pointer-events:none;
}
.keep-card:hover {
  transform:translateY(-5px);
  box-shadow:0 12px 28px rgba(0,0,0,0.45);
}

/* Corner glyph deco */
.keep-card::after {
  content:'◈'; position:absolute; bottom:14px; right:16px;
  font-size:30px; opacity:0.12; color:#fff; pointer-events:none;
  font-family:'IBM Plex Mono',monospace;
}

.card-title {
  font-family:'Orbitron',sans-serif;
  font-size:22px; font-weight:700; color:#fff;
  letter-spacing:1px; word-break:break-word; line-height:1.2;
}
.card-date {
  font-size:11px; color:rgba(255,255,255,0.75);
  margin-top:7px; letter-spacing:2px;
}

/* Details — revealed on hover */
.card-details {
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height 0.28s ease, opacity 0.28s ease, margin-top 0.28s ease, padding-top 0.28s ease;
  border-top:1px solid rgba(255,255,255,0.2);
  margin-top:0; padding-top:0;
}
.keep-card:hover .card-details {
  max-height:120px; opacity:1; margin-top:14px; padding-top:10px;
}
.detail-row {
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; color:#fff; margin-bottom:5px; letter-spacing:1px;
}
.detail-row span { opacity:0.75; }
.detail-row strong { font-weight:700; }

/* Status pill on card */
.card-status {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:20px;
  background:rgba(255,255,255,0.15);
  font-size:9px; letter-spacing:2px; color:#fff;
  align-self:flex-start; margin-bottom:8px;
}
.card-status .sdot {
  width:5px; height:5px; border-radius:50%; background:#fff;
}

/* ── SKELETON LOADER ─────────────────────────────────────────── */
.skel {
  border-radius:16px; min-height:150px;
  background:rgba(0,255,65,0.04); border:1px solid var(--bdr);
  animation:skelpulse 1.4s ease-in-out infinite;
}
@keyframes skelpulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

/* ── ANIMATIONS ──────────────────────────────────────────────── */
@keyframes sweep { to { transform:rotate(360deg); } }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width:600px) {
  #main-nav { padding:0 14px; }
  .nav-user, #nav-clock { display:none; }
  #dashboard { padding:66px 14px 40px; }
  .card-title { font-size:18px; }
}
</style>
</head>
<body>

<!-- ════════════════ NAV (shown after auth) ════════════════════ -->
<nav id="main-nav">
  <a href="/" class="nav-logo">OAKON//LABS</a>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <span id="nav-clock"></span>
    <button class="nav-signout" onclick="signOut()">SIGN OUT</button>
  </div>
</nav>

<!-- ════════════════ BOUNCER SCREEN ═══════════════════════════ -->
<div id="bouncer-screen">
  <div class="b-radar">
    <div class="b-ring"></div>
    <div class="b-ring"></div>
    <div class="b-ring"></div>
    <div class="b-sweep"></div>
  </div>

  <div class="b-title">PLAYS//PORTAL</div>
  <div class="b-sub">OAKON LABS · AUTHORISED ACCESS ONLY</div>

  <div class="b-desc">
    Sign in with your authorised Google account<br>
    to access the dashboard portal.
  </div>

  <!-- Google One Tap / Sign-in button -->
  <div id="g_id_onload"
       data-client_id="455995363048-7keld999n5fjgmlelh6kmjqdom3e1hu4.apps.googleusercontent.com"
       data-callback="onGoogleSignIn"
       data-auto_prompt="true">
  </div>
  <div class="g_id_signin"
       data-type="standard"
       data-theme="outline"
       data-text="sign_in_with"
       data-size="large"
       data-shape="rectangular">
  </div>

  <div id="b-error"></div>
  <div class="b-lock">⚿ &nbsp;FEDERATED SSO · WHITELIST CONTROLLED</div>
</div>

<!-- ════════════════ DASHBOARD (shown after auth) ═════════════ -->
<div id="dashboard">
  <div class="inner">
    <div class="tabs-wrap" id="tabs-wrap">
      <!-- Skeleton tabs while loading -->
      <div style="height:34px;width:90px;border-radius:2px;background:rgba(0,255,65,0.04);border:1px solid var(--bdr);animation:skelpulse 1.4s infinite"></div>
      <div style="height:34px;width:80px;border-radius:2px;background:rgba(0,255,65,0.04);border:1px solid var(--bdr);animation:skelpulse 1.4s infinite .2s"></div>
      <div style="height:34px;width:70px;border-radius:2px;background:rgba(0,255,65,0.04);border:1px solid var(--bdr);animation:skelpulse 1.4s infinite .4s"></div>
    </div>

    <div class="tab-label" id="tab-label">LOADING</div>

    <div class="card-grid" id="card-grid">
      <!-- Skeleton cards -->
      <div class="skel"></div>
      <div class="skel" style="animation-delay:.1s"></div>
      <div class="skel" style="animation-delay:.2s"></div>

    </div>
  </div>
</div>

<!-- ════════════════ SCRIPTS ══════════════════════════════════ -->
<script type="module">

/* ═══════════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════════ */

// ── Whitelist — injected by GitHub Actions from Secret GMAIL_WHITELIST ─────
const WHITELIST = "__GMAIL_WHITELIST__".split(',').map(e => e.trim().toLowerCase()).filter(Boolean);

// ── Tab names — injected by GitHub Actions from Secret MAIN_TABS ─────────────
// ── Format: "Holdings,Review,Exits"
const MAIN_TABS = "__MAIN_TABS__".split(',').map(t => t.trim()).filter(Boolean);

// ── Firebase config — injected by GitHub Actions from Secrets ────────────────
// ── tabs.json is NOT deployed; config lives only in this baked-in HTML file
const FB_CONFIG = {
  apiKey:            "__FIREBASE_API_KEY__",
  authDomain:        "__FIREBASE_AUTH_DOMAIN__",
  projectId:         "__FIREBASE_PROJECT_ID__",
  storageBucket:     "__FIREBASE_STORAGE_BUCKET__",
  messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
  appId:             "__FIREBASE_APP_ID__",
};

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let allCards      = [];
let currentTab    = "";
let firebaseReady = false;
let db            = null;

const CARD_COLORS = [
  "#1a6b3c",  // deep green
  "#0d4a6e",  // deep navy
  "#5c2d91",  // deep purple
  "#7a3a00",  // deep amber
  "#8b0000",  // deep red
  "#004d5a",  // teal
  "#2d4a00",  // forest
  "#4a1a5c",  // violet
];

/* ═══════════════════════════════════════════════════════════════
   GOOGLE AUTH CALLBACK (global — called by GSI library)
═══════════════════════════════════════════════════════════════ */
window.onGoogleSignIn = function(response) {
  try {
    const [, b64] = response.credential.split('.');
    const user = JSON.parse(atob(b64.replace(/-/g,'+').replace(/_/g,'/')));
    const email = (user.email || '').trim().toLowerCase();

    const allowed = WHITELIST.some(e => e.trim().toLowerCase() === email);

    if (!allowed) {
      showError(`⛔ Access denied — ${user.email} is not on the access list.`);
      return;
    }

    // Authorised — hand off to dashboard
    onAuthorised(user);
  } catch(e) {
    showError('Authentication error. Please try again.');
    console.error(e);
  }
};

window.signOut = function() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('main-nav').style.display = 'none';
  document.getElementById('bouncer-screen').style.display = 'flex';
  document.getElementById('b-error').style.display = 'none';
  document.getElementById('nav-user').textContent = '';
};

function showError(msg) {
  const el = document.getElementById('b-error');
  el.textContent = msg;
  el.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════════════
   POST-AUTH BOOT
═══════════════════════════════════════════════════════════════ */
async function onAuthorised(user) {
  // Show nav + dashboard, hide bouncer
  document.getElementById('bouncer-screen').style.display = 'none';
  document.getElementById('main-nav').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('nav-user').textContent = user.email;

  startClock();
  await loadTabsAndFirebase();
}

/* ═══════════════════════════════════════════════════════════════
   BOOT DASHBOARD — no fetch needed, all config baked in at build
═══════════════════════════════════════════════════════════════ */
async function loadTabsAndFirebase() {
  // ── Render tab buttons from baked-in MAIN_TABS ───────────────
  const tabs = MAIN_TABS.length ? MAIN_TABS : ["Holdings", "Review", "Exits"];
  currentTab = tabs[0];
  const wrap = document.getElementById('tabs-wrap');
  wrap.innerHTML = '';
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t;
    btn.dataset.tab = t;
    btn.onclick = () => switchTab(t);
    wrap.appendChild(btn);
  });

  // ── Init Firebase from baked-in FB_CONFIG ────────────────────
  if (FB_CONFIG.projectId && !FB_CONFIG.projectId.startsWith('__')) {
    try {
      const { initializeApp }                     = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
      const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

      const app = initializeApp(FB_CONFIG, 'plays-portal');
      db = getFirestore(app);
      firebaseReady = true;

      await loadCards(getDocs, collection);
    } catch(fbErr) {
      console.error('Firebase init error:', fbErr);
      showGridError('Firebase connection failed. Check GitHub Secrets.');
    }
  } else {
    // Secrets not yet injected — show demo cards
    renderDemoCards();
  }
}

/* ═══════════════════════════════════════════════════════════════
   FIREBASE CARD LOAD
═══════════════════════════════════════════════════════════════ */
async function loadCards(getDocs, collection) {
  try {
    const snap = await getDocs(collection(db, "cards"));
    allCards = [];
    snap.forEach(doc => {
      const r = doc.data();
      // Support both plain values and Firestore REST-style {stringValue:...}
      const v = (field, fallback='') =>
        r[field]?.stringValue ?? r[field] ?? fallback;

      allCards.push({
        category: v('category','Holdings'),
        company:  v('Company','Unknown'),
        dateStr:  v('Date',''),
        price:    v('Price','—'),
        target:   v('Target','—'),
        status:   v('Status',''),
        note:     v('Note',''),
      });
    });

    // Debug — check categories fetched vs current tab
    const cats = [...new Set(allCards.map(c => c.category))];
    console.log(`[OakOn] Firestore: ${allCards.length} cards loaded`);
    console.log(`[OakOn] Categories in Firestore: ${cats.join(', ')}`);
    console.log(`[OakOn] Current tab (MAIN_TABS): ${currentTab}`);
    console.log(`[OakOn] Match check: "${cats[0]}" === "${currentTab}" → ${cats[0]?.toLowerCase() === currentTab?.toLowerCase()}`);

    renderCards();
  } catch(err) {
    console.error('Firestore read error:', err);
    showGridError('Could not read Firestore. Check collection name and rules.');
  }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderCards();
}

function renderCards() {
  document.getElementById('tab-label').textContent = currentTab.toUpperCase();
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  const filtered = allCards.filter(
    c => c.category.trim().toLowerCase() === currentTab.trim().toLowerCase()
  );

  console.log(`[OakOn] Tab "${currentTab}" → ${filtered.length} matching cards`);

  if (!filtered.length) {
    const cats = [...new Set(allCards.map(c => c.category))];
    const hint = cats.length
      ? `<div style="font-size:10px;margin-top:8px;color:rgba(0,229,255,0.5)">Firestore has: ${cats.join(', ')}<br>Tab looking for: ${currentTab}</div>`
      : '';
    grid.innerHTML = `<div class="empty-msg">[ NO RECORDS FOR ${currentTab.toUpperCase()} ]${hint}</div>`;
    return;
  }

  filtered.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'keep-card';
    el.style.background = CARD_COLORS[idx % CARD_COLORS.length];

    const dateFmt = fmtDate(card.dateStr);
    const statusHtml = card.status
      ? `<div class="card-status"><span class="sdot"></span>${card.status.toUpperCase()}</div>`
      : '';
    const noteHtml = card.note
      ? `<div class="detail-row"><span>Note:</span> <strong>${card.note}</strong></div>`
      : '';

    el.innerHTML = `
      <div>
        ${statusHtml}
        <div class="card-title">${escHtml(card.company)}</div>
        <div class="card-date">${dateFmt}</div>
      </div>
      <div class="card-details">
        <div class="detail-row"><span>Price</span><strong>${escHtml(card.price)}</strong></div>
        <div class="detail-row"><span>Target</span><strong>${escHtml(card.target)}</strong></div>
        ${noteHtml}
      </div>`;
    grid.appendChild(el);
  });
}

function renderDemoCards() {
  // Demo data so layout is visible even without Firebase
  allCards = [
    { category:'Holdings', company:'ALPHA CORP',  dateStr:'2026-03-01', price:'₹2,480', target:'₹3,200', status:'ACTIVE',     note:'Q1 results strong' },
    { category:'Holdings', company:'BETA LTD',    dateStr:'2026-01-15', price:'₹880',   target:'₹1,100', status:'MONITORING', note:'' },
    { category:'Holdings', company:'GAMMA INC',   dateStr:'2025-11-20', price:'₹4,200', target:'₹5,500', status:'ACTIVE',     note:'' },
    { category:'Review',   company:'DELTA PLC',   dateStr:'2026-05-01', price:'₹310',   target:'₹420',   status:'PENDING',    note:'Awaiting Q2 data' },
    { category:'Review',   company:'EPSILON CO',  dateStr:'2026-04-10', price:'₹760',   target:'₹950',   status:'PENDING',    note:'' },
    { category:'Exits',    company:'ZETA GROUP',  dateStr:'2024-09-14', price:'₹1,200', target:'—',       status:'EXITED',     note:'Returned 42% ROI' },
  ];
  renderCards();
}

function showGridError(msg) {
  document.getElementById('card-grid').innerHTML =
    `<div class="empty-msg" style="color:rgba(255,58,58,0.7)">⚠ ${escHtml(msg)}</div>`;
}

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════ */
function fmtDate(str) {
  if (!str) return '—';
  try {
    const d = new Date(str);
    if (isNaN(d)) return str;
    return `${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
  } catch { return str; }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startClock() {
  const el = document.getElementById('nav-clock');
  const tick = () => {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    el.textContent = `IST ${pad(new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'})).getHours())}:${pad(new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'})).getMinutes())}:${pad(new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'})).getSeconds())}`;
  };
  tick();
  setInterval(tick, 1000);
}

</script>
</body>
