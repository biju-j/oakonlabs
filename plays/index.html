<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAKON LABS · PLAYS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;700&display=swap" rel="stylesheet">

<!-- All config injected by GitHub Actions at deploy time. No manual edits needed. -->

<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --g:   #00FF41;  --gd: #008B23;  --cy: #00E5FF;
  --am:  #FFB400;  --rd: #FF3A3A;
  --bg:  #020C06;  --bg2: #040F09;
  --bdr: rgba(0,255,65,0.13);
  --txt: #9EC9A8;
  --card-gap: 18px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { min-height:100vh; overflow-x:hidden; }
body {
  background:var(--bg);
  color:var(--txt);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
}
a { color:var(--g); text-decoration:none; }

/* Grid atmosphere */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,65,0.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,0.022) 1px,transparent 1px);
  background-size:42px 42px;
}
body::after {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
}

/* ── NAV ─────────────────────────────────────────────────────── */
#main-nav {
  display:none; position:fixed; top:0; left:0; right:0; z-index:200;
  height:52px; padding:0 28px;
  align-items:center; justify-content:space-between;
  background:rgba(2,12,6,0.97); border-bottom:1px solid var(--bdr);
  backdrop-filter:blur(10px);
}
.nav-logo {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:12px; letter-spacing:4px; color:var(--g);
  text-shadow:0 0 12px var(--g);
}
.nav-right { display:flex; align-items:center; gap:14px; font-size:9px; }
.nav-user  { color:var(--cy); font-size:9px; }
#nav-clock { font-variant-numeric:tabular-nums; color:var(--gd); }
.nav-signout {
  padding:4px 12px; border:1px solid rgba(255,58,58,0.35);
  color:var(--rd); background:rgba(255,58,58,0.04);
  font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:2px;
  cursor:pointer; border-radius:2px; transition:all 0.2s;
}
.nav-signout:hover { background:rgba(255,58,58,0.12); }

/* ── BOUNCER SCREEN ──────────────────────────────────────────── */
#bouncer-screen {
  position:fixed; inset:0; background:var(--bg); z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:24px; text-align:center;
}
.b-radar {
  position:relative; width:110px; height:110px;
}
.b-ring {
  position:absolute; border-radius:50%;
  border:1px solid rgba(0,255,65,0.2); inset:0;
}
.b-ring:nth-child(2){ inset:22%; border-color:rgba(0,255,65,0.16); }
.b-ring:nth-child(3){ inset:44%; border-color:rgba(0,255,65,0.28); }
.b-sweep {
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,transparent 290deg,rgba(0,255,65,0.06) 310deg,rgba(0,255,65,0.38) 360deg);
  animation:sweep 3.6s linear infinite;
}
.b-title {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:clamp(20px,4vw,30px); letter-spacing:5px; color:#fff;
  text-shadow:0 0 28px rgba(0,255,65,0.18);
}
.b-sub { font-size:9px; letter-spacing:4px; color:var(--gd); }
.b-desc { font-size:12px; line-height:1.9; color:var(--txt); max-width:340px; }
#b-error {
  display:none; font-size:11px; letter-spacing:1px;
  color:var(--rd); border:1px solid rgba(255,58,58,0.3);
  padding:9px 18px; border-radius:2px; background:rgba(255,58,58,0.04);
  max-width:360px;
}
.b-lock { font-size:9px; letter-spacing:3px; color:var(--gd); }

/* ── DASHBOARD ───────────────────────────────────────────────── */
#dashboard { display:none; padding:72px 24px 60px; position:relative; z-index:1; }
.inner { max-width:1120px; margin:0 auto; }

/* ── TABS ────────────────────────────────────────────────────── */
.tabs-wrap {
  display:flex; gap:8px; flex-wrap:wrap;
  margin-bottom:28px; padding-bottom:14px;
  border-bottom:1px solid var(--bdr);
}
.tab-btn {
  padding:8px 20px; border-radius:2px; cursor:pointer;
  border:1px solid var(--bdr); color:var(--gd);
  background:rgba(0,255,65,0.025);
  font-family:'Orbitron',sans-serif; font-size:9px;
  font-weight:700; letter-spacing:3px;
  border-radius:20px;
  transition:all 0.2s;
}
/* Holdings — cyan */
.tab-btn[data-tab="Holdings"]:hover,
.tab-btn[data-tab="Holdings"].active {
  background:rgba(0,229,255,0.10); color:var(--cy);
  border-color:rgba(0,229,255,0.55);
  box-shadow:0 0 16px rgba(0,229,255,0.18);
  text-shadow:0 0 10px rgba(0,229,255,0.4);
}
/* Review — filled blue pill */
.tab-btn[data-tab="Review"]:hover {
  background:#3AABCC; color:#fff; border-color:#3AABCC;
  box-shadow:0 4px 14px rgba(58,171,204,0.35);
}
.tab-btn[data-tab="Review"].active {
  background:#3AABCC; color:#fff; border-color:#3AABCC;
  box-shadow:0 4px 18px rgba(58,171,204,0.45);
  text-shadow:none;
}
/* Exits — white */
.tab-btn[data-tab="Exits"]:hover,
.tab-btn[data-tab="Exits"].active {
  background:rgba(255,255,255,0.08); color:#fff;
  border-color:rgba(255,255,255,0.45);
  box-shadow:0 0 16px rgba(255,255,255,0.12);
  text-shadow:0 0 10px rgba(255,255,255,0.35);
}

/* ── TAB LABEL ───────────────────────────────────────────────── */
.tab-label {
  font-family:'Orbitron',sans-serif; font-size:8px; letter-spacing:4px;
  color:var(--cy); margin-bottom:18px; opacity:0.7;
}
.tab-label::before { content:'// '; opacity:0.4; }

/* ── CARD GRID ───────────────────────────────────────────────── */
.card-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:var(--card-gap);
}
.empty-msg {
  grid-column:1/-1; text-align:center;
  color:var(--gd); font-size:12px; padding:48px 0;
  letter-spacing:2px;
}

/* ── KEEP-STYLE CARD ─────────────────────────────────────────── */
.keep-card {
  border-radius:24px; padding:24px 24px 0;
  min-height:260px; position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform 0.22s ease, box-shadow 0.22s ease;
  cursor:default; border:none;
}
.keep-card:hover {
  transform:translateY(-6px);
  box-shadow:0 16px 36px rgba(0,0,0,0.35);
}
.card-header-row {
  display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
}
.card-title {
  font-family:'Orbitron',sans-serif;
  font-size:18px; font-weight:900; color:rgba(0,0,0,0.82);
  letter-spacing:0; word-break:break-word; line-height:1.2;
}
.card-arrow {
  font-size:18px; color:rgba(0,0,0,0.4); flex-shrink:0; margin-top:2px;
}
.card-desc {
  font-size:12px; color:rgba(0,0,0,0.55); line-height:1.7;
  margin-top:8px; font-family:'IBM Plex Mono',monospace; font-weight:300;
}
.card-date {
  font-size:10px; color:rgba(0,0,0,0.4);
  letter-spacing:1px; margin-top:4px;
}
.card-illustration {
  flex:1; position:relative; display:flex;
  align-items:center; justify-content:center;
  overflow:hidden; margin-top:10px; min-height:72px;
}
/* Shadow ticker — always shown, 80% of original 72px */
.card-ticker-big {
  font-family:'Orbitron',sans-serif; font-size:58px; font-weight:900;
  color:rgba(0,0,0,0.09); line-height:1; letter-spacing:-2px;
  user-select:none; white-space:nowrap; text-align:center;
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
}
/* Logo centered on top of shadow ticker */
.card-logo {
  position:relative; z-index:2;
  width:58px; height:58px; object-fit:contain; border-radius:12px;
  background:rgba(255,255,255,0.65); padding:6px;
  box-shadow:0 3px 14px rgba(0,0,0,0.13);
  transition:transform 0.2s;
}
.card-logo:hover { transform:scale(1.1); }
/* Details — revealed on hover */
.card-details {
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height 0.28s ease, opacity 0.28s ease, margin-top 0.28s ease, padding-top 0.28s ease;
  border-top:1px solid rgba(0,0,0,0.12);
  margin-top:0; padding-top:0;
}
.keep-card:hover .card-details {
  max-height:120px; opacity:1; margin-top:12px; padding-top:10px;
}
.detail-row {
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; color:rgba(0,0,0,0.65); margin-bottom:5px; letter-spacing:1px;
}
.detail-row span { opacity:0.65; }
.detail-row strong { font-weight:700; color:rgba(0,0,0,0.82); }
/* Status pill */
.card-status {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:20px;
  background:rgba(0,0,0,0.1);
  font-size:9px; letter-spacing:2px; color:rgba(0,0,0,0.6);
  align-self:flex-start; margin-bottom:6px;
}
.card-status .sdot { width:5px; height:5px; border-radius:50%; background:rgba(0,0,0,0.5); }

/* ── HEX OVERLAY — vertical stacked layout ───────────────────── */
/* The card needs relative positioning for the overlay */
.keep-card { position:relative; }

.hex-overlay {
  position:absolute; inset:0; border-radius:24px;
  padding:14px 14px 14px 10px;
  display:flex; flex-direction:column; justify-content:center; gap:6px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity 0.28s ease, transform 0.28s ease;
  background:inherit;           /* same pastel as card */
  backdrop-filter:blur(2px);
  z-index:10;
}
.keep-card:hover .hex-overlay {
  opacity:1; transform:translateY(0); pointer-events:all;
}

/* One row: hex left + text panel right */
.hx-row {
  display:flex; align-items:center; gap:8px;
}
/* Cascade stagger matching the screenshot */
.hx-row:nth-child(1) { padding-left:0;  }
.hx-row:nth-child(2) { padding-left:12px; }
.hx-row:nth-child(3) { padding-left:20px; }
.hx-row:nth-child(4) { padding-left:12px; }
.hx-row:nth-child(5) { padding-left:0;  }

/* Hexagon shape */
.hx-shape {
  width:42px; height:42px; flex-shrink:0;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex; align-items:center; justify-content:center;
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:15px; color:#fff;
  transition:transform 0.15s;
  cursor:default;
}
.hx-shape:hover { transform:scale(1.12); }

/* Text panel */
.hx-panel {
  flex:1; background:rgba(255,255,255,0.72);
  border-radius:5px; padding:5px 10px;
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; min-width:0; box-shadow:0 1px 4px rgba(0,0,0,0.08);
}
.hx-text {
  font-size:11px; color:rgba(0,0,0,0.65); font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:1; min-width:0;
}
.hx-text strong { color:rgba(0,0,0,0.82); font-weight:700; }
.hx-badge {
  font-size:15px; flex-shrink:0; line-height:1;
}

/* ── SKELETON LOADER ─────────────────────────────────────────── */
.skel {
  border-radius:16px; min-height:150px;
  background:rgba(0,255,65,0.04); border:1px solid var(--bdr);
  animation:skelpulse 1.4s ease-in-out infinite;
}
@keyframes skelpulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

/* ── WATCH CARD (Review tab) ─────────────────────────────────── */
.watch-card {
  border-radius:24px; padding:20px 20px 16px;
  background:#3AABCC; border:none;
  display:flex; flex-direction:column; gap:0;
  transition:transform 0.22s ease, box-shadow 0.22s ease;
  position:relative; overflow:hidden; min-height:260px;
}
.watch-card:hover {
  transform:translateY(-6px);
  box-shadow:0 16px 32px rgba(58,171,204,0.45);
}
/* Radar scan scene */
.radar-scene {
  flex:1; display:flex; align-items:center; justify-content:center;
  min-height:130px;
}
.radar-scene svg { width:110px; height:110px; }
/* Watch name/date/progressor */
/* Watch card top header row */
.watch-header {
  display:flex; justify-content:space-between;
  align-items:flex-start; gap:8px; margin-bottom:4px;
}
.watch-name {
  font-family:'Orbitron',sans-serif; font-size:15px; font-weight:700;
  color:#fff; letter-spacing:0.5px;
  word-break:break-word; line-height:1.3; flex:1;
}
.watch-date-badge {
  display:flex; align-items:center; gap:4px;
  background:rgba(255,255,255,0.18); border-radius:20px;
  padding:3px 9px; flex-shrink:0;
}
.watch-eye-icon { color:rgba(255,255,255,0.8); line-height:1; }
.watch-date {
  font-size:10px; color:rgba(255,255,255,0.85);
  letter-spacing:1px; white-space:nowrap;
}
/* Price — hidden, revealed on hover */
.watch-hover-details {
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height 0.28s ease, opacity 0.28s ease,
             margin-top 0.28s ease, padding-top 0.28s ease;
  border-top:1px solid rgba(255,255,255,0.2);
  margin-top:0; padding-top:0;
}
.watch-card:hover .watch-hover-details {
  max-height:80px; opacity:1; margin-top:8px; padding-top:8px;
}
.watch-detail {
  display:flex; justify-content:space-between;
  font-size:12px; color:rgba(255,255,255,0.7);
  letter-spacing:1px; margin-bottom:4px;
}
.watch-detail strong { color:#fff; font-weight:700; }
.watch-divider { display:none; }
/* Yellow progressor */
.watch-progressor { margin-top:10px; }
.watch-prog-label {
  font-size:8px; letter-spacing:3px; color:rgba(255,255,255,0.55);
  margin-bottom:5px;
}
.watch-prog-track {
  height:4px; background:rgba(255,255,255,0.2);
  border-radius:2px; overflow:hidden;
}
.watch-prog-fill {
  height:100%; border-radius:2px; background:#FFD700;
  box-shadow:0 0 8px rgba(255,215,0,0.6);
  animation:progressor 2.8s ease-in-out infinite;
}
.watch-top { display:flex; align-items:center; gap:14px; }
.scan-ring {
  stroke:rgba(255,255,255,0.45); fill:none; stroke-width:1.2;
}
.scan-sector {
  fill:rgba(255,215,0,0.12);
}
.scan-line {
  stroke:#FFD700; fill:none;
  stroke-width:2.5; stroke-linecap:round;
  animation:scanRotate 3s linear infinite;
  transform-origin:55px 55px;
  filter:drop-shadow(0 0 4px #FFD700);
}
.scan-dot {
  fill:#FFD700; filter:drop-shadow(0 0 5px #FFD700);
  animation:scanPulse 3s ease-in-out infinite;
}
@keyframes scanRotate { to { transform:rotate(360deg); } }
@keyframes scanPulse  { 0%,100%{opacity:.3} 50%{opacity:1} }
.watch-info { flex:1; min-width:0; }
.watch-name {
  font-family:'Orbitron',sans-serif; font-size:16px; font-weight:700;
  color:#fff; letter-spacing:1px;
  word-break:break-word; line-height:1.3; flex:1;
}
.watch-date {
  font-size:10px; color:rgba(255,255,255,0.7);
  letter-spacing:1px; white-space:nowrap;
}
.watch-divider {
  height:1px; background:rgba(255,255,255,0.2); margin:14px 0 10px;
}
.watch-detail {
  display:flex; justify-content:space-between;
  font-size:12px; color:rgba(255,255,255,0.7);
  letter-spacing:1px; margin-bottom:5px;
}
.watch-detail strong { color:#fff; font-weight:700; }
/* Yellow progressor bar */
.watch-progressor {
  margin-top:auto; padding-top:16px;
}
.watch-prog-label {
  font-size:8px; letter-spacing:3px; color:rgba(255,255,255,0.6);
  margin-bottom:5px;
}
.watch-prog-track {
  height:4px; background:rgba(255,255,255,0.2);
  border-radius:2px; overflow:hidden;
}
.watch-prog-fill {
  height:100%; border-radius:2px; background:#FFD700;
  box-shadow:0 0 8px rgba(255,215,0,0.7);
  animation:progressor 2.8s ease-in-out infinite;
}
@keyframes progressor {
  0%   { width:15%; opacity:.7; }
  50%  { width:75%; opacity:1;  }
  100% { width:15%; opacity:.7; }
}

/* ── ANIMATIONS ──────────────────────────────────────────────── */
@keyframes sweep { to { transform:rotate(360deg); } }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width:600px) {
  #main-nav { padding:0 14px; }
  .nav-user, #nav-clock { display:none; }
  #dashboard { padding:66px 14px 40px; }
  .card-title { font-size:18px; }
}
</style>
</head>
<body>

<!-- ════════════════ NAV (shown after auth) ════════════════════ -->
<nav id="main-nav">
  <a href="/" class="nav-logo">OAKON//LABS</a>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <span id="nav-clock"></span>
    <button class="nav-signout" onclick="signOut()">SIGN OUT</button>
  </div>
</nav>

<!-- ════════════════ BOUNCER SCREEN ═══════════════════════════ -->
<div id="bouncer-screen">
  <div class="b-radar">
    <div class="b-ring"></div>
    <div class="b-ring"></div>
    <div class="b-ring"></div>
    <div class="b-sweep"></div>
  </div>

  <div class="b-title">PLAYS//PORTAL</div>
  <div class="b-sub">OAKON LABS · AUTHORISED ACCESS ONLY</div>

  <div class="b-desc">
    Sign in with your authorised Google account<br>
    to access the dashboard portal.
  </div>

  <!-- Google One Tap / Sign-in button -->
  <div id="g_id_onload"
       data-client_id="455995363048-7keld999n5fjgmlelh6kmjqdom3e1hu4.apps.googleusercontent.com"
       data-callback="onGoogleSignIn"
       data-auto_prompt="true">
  </div>
  <div class="g_id_signin"
       data-type="standard"
       data-theme="outline"
       data-text="sign_in_with"
       data-size="large"
       data-shape="rectangular">
  </div>

  <div id="b-error"></div>
  <div class="b-lock">⚿ &nbsp;FEDERATED SSO · WHITELIST CONTROLLED</div>
</div>

<!-- ════════════════ DASHBOARD (shown after auth) ═════════════ -->
<div id="dashboard">
  <div class="inner">
    <div class="tabs-wrap" id="tabs-wrap">
      <!-- Skeleton tabs while loading -->
      <div style="height:34px;width:90px;border-radius:2px;background:rgba(0,255,65,0.04);border:1px solid var(--bdr);animation:skelpulse 1.4s infinite"></div>
      <div style="height:34px;width:80px;border-radius:2px;background:rgba(0,255,65,0.04);border:1px solid var(--bdr);animation:skelpulse 1.4s infinite .2s"></div>
      <div style="height:34px;width:70px;border-radius:2px;background:rgba(0,255,65,0.04);border:1px solid var(--bdr);animation:skelpulse 1.4s infinite .4s"></div>
    </div>

    <div id="tab-label" style="display:none"></div>

    <div class="card-grid" id="card-grid">
      <!-- Skeleton cards -->
      <div class="skel"></div>
      <div class="skel" style="animation-delay:.1s"></div>
      <div class="skel" style="animation-delay:.2s"></div>
      <div class="skel" style="animation-delay:.3s"></div>
    </div>
  </div>
</div>

<!-- ════════════════ SCRIPTS ══════════════════════════════════ -->
<script type="module">

/* ═══════════════════════════════════════════════════════════════
   TRUSTED TYPES — allows innerHTML in strict CSP environments.
   Required because Google Sign-In enforces Trusted Types.
═══════════════════════════════════════════════════════════════ */
const _html = (() => {
  try {
    if (window.trustedTypes && window.trustedTypes.createPolicy) {
      const p = window.trustedTypes.createPolicy('oakon#html', { createHTML: s => s });
      return (el, html) => { el.innerHTML = p.createHTML(html); };
    }
  } catch(e) { /* policy already exists or not enforced */ }
  return (el, html) => { el.innerHTML = html; };
})();

/* ═══════════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════════ */

// ── Whitelist — injected by GitHub Actions from Secret GMAIL_WHITELIST ─────
const WHITELIST = "__GMAIL_WHITELIST__".split(',').map(e => e.trim().toLowerCase()).filter(Boolean);

// ── Tab names — injected by GitHub Actions from Secret MAIN_TABS ─────────────
// ── Format: "Holdings,Review,Exits"
const MAIN_TABS = "__MAIN_TABS__".split(',').map(t => t.trim()).filter(Boolean);

// ── Firebase config — injected by GitHub Actions from Secrets ────────────────
// ── tabs.json is NOT deployed; config lives only in this baked-in HTML file
const FB_CONFIG = {
  apiKey:            "__FIREBASE_API_KEY__",
  authDomain:        "__FIREBASE_AUTH_DOMAIN__",
  projectId:         "__FIREBASE_PROJECT_ID__",
  storageBucket:     "__FIREBASE_STORAGE_BUCKET__",
  messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
  appId:             "__FIREBASE_APP_ID__",
};

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let allCards      = [];
let currentTab    = "";
let firebaseReady = false;
let db            = null;

const CARD_COLORS = [
  "#b8dcf8",   // pastel blue
  "#ffd6e8",   // pastel pink
  "#c8f0d8",   // pastel green
  "#fdefc0",   // pastel yellow
  "#ddd4f8",   // pastel lavender
  "#c8eef8",   // pastel sky
  "#ffdcc8",   // pastel peach
  "#d4f8e8",   // pastel mint
];

// ── Maps portal tab name → Firestore State values (lowercase) ───
// Edit here if your State column values change.
const TAB_CATEGORIES = {
  'launches': ['longterm', 'shortterm'],
  'review':   ['watch'],
  // 'exits':  ['exited', 'sold'],  ← add more tabs/mappings here
};
// State values to ignore completely
const IGNORED_STATES = ['rejected'];

/* ═══════════════════════════════════════════════════════════════
   GOOGLE AUTH CALLBACK (global — called by GSI library)
═══════════════════════════════════════════════════════════════ */
window.onGoogleSignIn = function(response) {
  try {
    const [, b64] = response.credential.split('.');
    const user = JSON.parse(atob(b64.replace(/-/g,'+').replace(/_/g,'/')));
    const email = (user.email || '').trim().toLowerCase();

    const allowed = WHITELIST.some(e => e.trim().toLowerCase() === email);

    if (!allowed) {
      showError(`⛔ Access denied — ${user.email} is not on the access list.`);
      return;
    }

    // Authorised — hand off to dashboard
    onAuthorised(user);
  } catch(e) {
    showError('Authentication error. Please try again.');
    console.error(e);
  }
};

window.signOut = function() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('main-nav').style.display = 'none';
  document.getElementById('bouncer-screen').style.display = 'flex';
  document.getElementById('b-error').style.display = 'none';
  document.getElementById('nav-user').textContent = '';
};

function showError(msg) {
  const el = document.getElementById('b-error');
  el.textContent = msg;
  el.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════════════
   POST-AUTH BOOT
═══════════════════════════════════════════════════════════════ */
async function onAuthorised(user) {
  // Show nav + dashboard, hide bouncer
  document.getElementById('bouncer-screen').style.display = 'none';
  document.getElementById('main-nav').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('nav-user').textContent = user.email;

  startClock();
  await loadTabsAndFirebase();
}

/* ═══════════════════════════════════════════════════════════════
   BOOT DASHBOARD — no fetch needed, all config baked in at build
═══════════════════════════════════════════════════════════════ */
async function loadTabsAndFirebase() {
  // ── Render tab buttons from baked-in MAIN_TABS ───────────────
  const tabs = MAIN_TABS.length ? MAIN_TABS : ["Holdings", "Review", "Exits"];
  currentTab = tabs[0];
  const wrap = document.getElementById('tabs-wrap');
  wrap.innerHTML = '';
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t;
    btn.dataset.tab = t;
    btn.onclick = () => switchTab(t);
    wrap.appendChild(btn);
  });

  // ── Init Firebase from baked-in FB_CONFIG ────────────────────
  if (FB_CONFIG.projectId && !FB_CONFIG.projectId.startsWith('__')) {
    try {
      const { initializeApp }                     = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
      const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

      const app = initializeApp(FB_CONFIG, 'plays-portal');
      db = getFirestore(app);
      firebaseReady = true;

      await loadCards(getDocs, collection);
    } catch(fbErr) {
      console.error('Firebase init error:', fbErr);
      showGridError('Firebase connection failed. Check GitHub Secrets.');
    }
  } else {
    // Secrets not yet injected — show demo cards
    renderDemoCards();
  }
}

/* ═══════════════════════════════════════════════════════════════
   FIREBASE CARD LOAD
═══════════════════════════════════════════════════════════════ */
async function loadCards(getDocs, collection) {
  try {
    const snap = await getDocs(collection(db, "cards"));
    allCards = [];
    snap.forEach(doc => {
      const r = doc.data();
      // Support both plain values and Firestore REST-style {stringValue:...}
      const v = (field, fallback='') =>
        r[field]?.stringValue ?? r[field] ?? fallback;

      allCards.push({
        category: v('category','Holdings'),
        company:  v('Company','Unknown'),
        dateStr:  v('Date',''),
        price:    v('Price','—'),
        target:   v('Target','—'),
        status:   v('Status',''),
        note:     v('Note',''),
      });
    });

    // Debug — check categories fetched vs current tab
    const cats = [...new Set(allCards.map(c => c.category))];
    console.log(`[OakOn] Firestore: ${allCards.length} cards loaded`);
    console.log(`[OakOn] Categories in Firestore: ${cats.join(', ')}`);
    console.log(`[OakOn] Current tab (MAIN_TABS): ${currentTab}`);
    console.log(`[OakOn] Match check: "${cats[0]}" === "${currentTab}" → ${cats[0]?.toLowerCase() === currentTab?.toLowerCase()}`);

    renderCards();
  } catch(err) {
    console.error('Firestore read error:', err);
    showGridError('Could not read Firestore. Check collection name and rules.');
  }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderCards();
}

function renderCards() {
  document.getElementById('tab-label').textContent = currentTab.toUpperCase();
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  const tabKey    = currentTab.trim().toLowerCase();
  const accepted  = TAB_CATEGORIES[tabKey] || [tabKey];
  const isReview  = tabKey === 'review';

  const filtered = allCards.filter(c => {
    const state = c.category.trim().toLowerCase();
    if (IGNORED_STATES.includes(state)) return false;
    return accepted.includes(state);
  });

  if (!filtered.length) {
    _html(grid, `<div class="empty-msg">[ NO RECORDS FOR ${currentTab.toUpperCase()} ]</div>`);
    return;
  }

  // Sort left-to-right by Date ascending
  filtered.sort((a, b) => {
    const da = a.dateStr ? new Date(a.dateStr) : new Date(0);
    const db = b.dateStr ? new Date(b.dateStr) : new Date(0);
    return da - db;
  });

  const isExits = tabKey === 'exits';

  filtered.forEach((card, idx) => {
    const el = document.createElement('div');
    if (isReview) {
      el.appendChild(buildWatchCard(card));
    } else if (isExits) {
      el.appendChild(buildExitsCard(card));
    } else {
      el.appendChild(buildHoldingsCard(card, idx));
    }
    grid.appendChild(el);
  });
}

function buildHoldingsCard(card, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'keep-card';
  wrap.style.background = CARD_COLORS[idx % CARD_COLORS.length];

  const dateFmt = fmtDate(card.dateStr);

  // ── Visible content (hidden behind overlay on hover) ─────────
  const top = document.createElement('div');
  const headerRow = document.createElement('div');
  headerRow.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px';
  const titleEl = document.createElement('div');
  titleEl.className = 'card-title'; titleEl.textContent = card.company;
  const dateEl = document.createElement('span');
  dateEl.className = 'card-date';
  dateEl.style.cssText = 'flex-shrink:0;margin-top:4px';
  dateEl.textContent = dateFmt;
  headerRow.appendChild(titleEl); headerRow.appendChild(dateEl);
  top.appendChild(headerRow);
  wrap.appendChild(top);

  const illus = document.createElement('div');
  illus.className = 'card-illustration';

  // Try logo first — cascade: Parqet → Clearbit
  // Only if all fail: show shadow ticker at 80% size, centred
  const img = document.createElement('img');
  img.className = 'card-logo';
  img.alt = card.company;
  const sources = [
    `https://assets.parqet.com/logos/symbol/${encodeURIComponent(card.company)}?format=jpg`,
    `https://logo.clearbit.com/${encodeURIComponent(card.company.toLowerCase())}.com`,
  ];
  let srcIdx = 0;
  img.src = sources[srcIdx];
  img.onerror = () => {
    srcIdx++;
    if (srcIdx < sources.length) {
      img.src = sources[srcIdx];
    } else {
      // All logo sources exhausted — show shadow ticker instead
      img.remove();
      const tickerShadow = document.createElement('div');
      tickerShadow.className = 'card-ticker-big';
      tickerShadow.textContent = card.company.toUpperCase();
      illus.appendChild(tickerShadow);
    }
  };
  illus.appendChild(img);
  wrap.appendChild(illus);

  // ── Hex overlay — appears on card hover ──────────────────────
  // 5 rows: colored hex left, text panel right, badge icon far right
  // Colors matching screenshot: pink, teal, orange, sage-green, blue
  const hexDefs = [
    { n:'1', bg:'#7C3AED', label:'LongTerm / ShortTerm', value: card.category || '—',  badge:'◆' },
    { n:'2', bg:'#00ACC1', label:'Entry date',            value: dateFmt,               badge:'🗓' },
    { n:'3', bg:'#F4511E', label:'Status',                value: card.status   || '—', badge:'⚙' },
    { n:'4', bg:'#43A047', label:'Price',                 value: card.price    || '—', badge:'$' },
    { n:'5', bg:'#1E88E5', label:'Target',                value: card.target   || '—', badge:'🚀' },
  ];

  const overlay = document.createElement('div');
  overlay.className = 'hex-overlay';

  hexDefs.forEach(def => {
    const row = document.createElement('div');
    row.className = 'hx-row';

    // Hexagon
    const shape = document.createElement('div');
    shape.className = 'hx-shape';
    shape.style.background = def.bg;
    shape.textContent = def.n;

    // Text panel
    const panel = document.createElement('div');
    panel.className = 'hx-panel';

    const txt = document.createElement('div');
    txt.className = 'hx-text';
    txt.innerHTML = `<strong>${def.label}:</strong> ${escHtml(def.value)}`;

    const badge = document.createElement('div');
    badge.className = 'hx-badge';
    badge.textContent = def.badge;

    panel.appendChild(txt);
    panel.appendChild(badge);
    row.appendChild(shape);
    row.appendChild(panel);
    overlay.appendChild(row);
  });

  wrap.appendChild(overlay);
  return wrap;
}

function buildWatchCard(card) {
  const wrap = document.createElement('div');
  wrap.className = 'watch-card';
  const dateFmt    = fmtDate(card.dateStr);
  const priceHtml  = card.price && card.price !== '—'
    ? `<div class="watch-detail"><span>Price</span><strong>${escHtml(card.price)}</strong></div>` : '';
  const targetHtml = card.target && card.target !== '—'
    ? `<div class="watch-detail"><span>Target</span><strong>${escHtml(card.target)}</strong></div>` : '';

  // ── Radar scan scene (DOM SVG) ──────────────────────
  const scene = document.createElement('div');
  scene.className = 'radar-scene';
  const ns2 = 'http://www.w3.org/2000/svg';
  const rsvg = document.createElementNS(ns2, 'svg');
  rsvg.setAttribute('viewBox','0 0 110 110');

  const makeC = (cx,cy,r,cls,op) => {
    const c = document.createElementNS(ns2,'circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy);
    c.setAttribute('r',r);   c.setAttribute('class',cls);
    if (op) c.setAttribute('opacity',op);
    return c;
  };
  const makeLine = (x1,y1,x2,y2,cls,dash) => {
    const l = document.createElementNS(ns2,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('class',cls);
    if (dash) l.setAttribute('stroke-dasharray',dash);
    return l;
  };
  // Rings
  rsvg.appendChild(makeC(55,55,50,'scan-ring'));
  rsvg.appendChild(makeC(55,55,34,'scan-ring','.65'));
  rsvg.appendChild(makeC(55,55,18,'scan-ring','.45'));
  // Crosshairs
  rsvg.appendChild(makeLine(5,55,105,55,'scan-ring','4 3'));
  rsvg.appendChild(makeLine(55,5,55,105,'scan-ring','4 3'));
  // Sweep line + tip dot
  const sweep = document.createElementNS(ns2,'line');
  sweep.setAttribute('x1','55'); sweep.setAttribute('y1','55');
  sweep.setAttribute('x2','55'); sweep.setAttribute('y2','6');
  sweep.setAttribute('class','scan-line');
  rsvg.appendChild(sweep);
  rsvg.appendChild(makeC(55,6,3,'scan-dot'));
  // Centre dot
  rsvg.appendChild(makeC(55,55,3,'scan-ring'));
  scene.appendChild(rsvg);
  wrap.appendChild(scene);

  // ── Top header: company name left, eye+date top-right ──────────
  const header = document.createElement('div');
  header.className = 'watch-header';

  const nm = document.createElement('div');
  nm.className = 'watch-name';
  nm.textContent = card.company;

  const dateBadge = document.createElement('div');
  dateBadge.className = 'watch-date-badge';

  // Eye SVG icon
  const eyeSpan = document.createElement('span');
  eyeSpan.className = 'watch-eye-icon';
  const ns = 'http://www.w3.org/2000/svg';
  const eyeSvg = document.createElementNS(ns, 'svg');
  eyeSvg.setAttribute('width','13'); eyeSvg.setAttribute('height','13');
  eyeSvg.setAttribute('viewBox','0 0 24 24');
  eyeSvg.setAttribute('fill','none');
  eyeSvg.setAttribute('stroke','rgba(255,255,255,0.85)');
  eyeSvg.setAttribute('stroke-width','2');
  eyeSvg.setAttribute('stroke-linecap','round');
  const eyePath = document.createElementNS(ns, 'path');
  eyePath.setAttribute('d','M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z');
  const eyeCircle = document.createElementNS(ns, 'circle');
  eyeCircle.setAttribute('cx','12'); eyeCircle.setAttribute('cy','12');
  eyeCircle.setAttribute('r','3');
  eyeSvg.appendChild(eyePath); eyeSvg.appendChild(eyeCircle);
  eyeSpan.appendChild(eyeSvg);

  const dt = document.createElement('span');
  dt.className = 'watch-date'; dt.textContent = dateFmt;

  dateBadge.appendChild(eyeSpan);
  dateBadge.appendChild(dt);
  header.appendChild(nm);
  header.appendChild(dateBadge);
  wrap.appendChild(header);

  // ── Magnify scene ─────────────────────────────────────────────
  wrap.appendChild(scene);

  // ── Price / target — hidden, revealed on hover ────────────────
  if (priceHtml || targetHtml) {
    const hoverDiv = document.createElement('div');
    hoverDiv.className = 'watch-hover-details';
    _html(hoverDiv, (priceHtml || '') + (targetHtml || ''));
    wrap.appendChild(hoverDiv);
  }

  // ── Yellow progressor bar ─────────────────────────────────────
  const prog = document.createElement('div');
  prog.className = 'watch-progressor';
  const pLabel = document.createElement('div');
  pLabel.className = 'watch-prog-label'; pLabel.textContent = 'PROGRESSOR';
  const pTrack = document.createElement('div');
  pTrack.className = 'watch-prog-track';
  const pFill = document.createElement('div');
  pFill.className = 'watch-prog-fill';
  pTrack.appendChild(pFill);
  prog.appendChild(pLabel); prog.appendChild(pTrack);
  wrap.appendChild(prog);
  return wrap;
}

function buildExitsCard(card) {
  const wrap = document.createElement('div');
  wrap.style.cssText = [
    'border-radius:12px','padding:22px 20px 18px',
    'background:rgba(255,255,255,0.04)',
    'border:1px solid rgba(255,255,255,0.18)',
    'display:flex','flex-direction:column','gap:10px',
    'min-height:180px','position:relative','overflow:hidden',
    'transition:transform 0.22s ease, box-shadow 0.22s ease'
  ].join(';');
  wrap.onmouseenter = () => {
    wrap.style.transform = 'translateY(-4px)';
    wrap.style.boxShadow = '0 10px 28px rgba(0,0,0,0.5)';
    wrap.style.borderColor = 'rgba(255,255,255,0.38)';
  };
  wrap.onmouseleave = () => {
    wrap.style.transform = ''; wrap.style.boxShadow = ''; wrap.style.borderColor = '';
  };
  const dateFmt    = fmtDate(card.dateStr);
  const statusHtml = card.status
    ? `<div style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.6);align-self:flex-start">${escHtml(card.status.toUpperCase())}</div>` : '';
  const priceHtml  = card.price && card.price !== '—'
    ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:1px"><span>Price</span><strong style="color:rgba(255,255,255,0.8)">${escHtml(card.price)}</strong></div>` : '';
  const targetHtml = card.target && card.target !== '—'
    ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:1px"><span>Target</span><strong style="color:rgba(255,255,255,0.8)">${escHtml(card.target)}</strong></div>` : '';
  const noteHtml   = card.note
    ? `<div style="font-size:11px;color:rgba(255,255,255,0.4);line-height:1.5">${escHtml(card.note)}</div>` : '';

  _html(wrap, `
    ${statusHtml}
    <div style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;line-height:1.3;word-break:break-word">${escHtml(card.company)}</div>
    <div style="font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:2px">${dateFmt}</div>
    ${priceHtml || targetHtml ? `<div style="height:1px;background:rgba(255,255,255,0.08)"></div>${priceHtml}${targetHtml}` : ''}
    ${noteHtml}`);
  return wrap;
}

}

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════ */
function fmtDate(str) {
  if (!str) return '—';
  try {
    const d = new Date(str);
    if (isNaN(d)) return str;
    return `${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
  } catch { return str; }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startClock() {
  const el = document.getElementById('nav-clock');
  const tick = () => {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    el.textContent = `IST ${pad(new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'})).getHours())}:${pad(new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'})).getMinutes())}:${pad(new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'})).getSeconds())}`;
  };
  tick();
  setInterval(tick, 1000);
}
